<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyCloud Labs Helm Charts</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d1d9e0;
      --code: #f6f8fa; --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d;
        --code: #161b22; --link: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto; max-width: 760px; padding: 48px 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 40px 0 12px; }
    p { margin: 0; color: var(--muted); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    pre, code { font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; overflow-x: auto; }
    .chart { border-top: 1px solid var(--line); padding: 16px 0; }
    .chart:last-of-type { border-bottom: 1px solid var(--line); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .name { font-weight: 600; font-size: 1.05rem; }
    .version { color: var(--muted); font-size: 0.875rem; }
    .chart pre { margin: 8px 0 0; }
    details { margin-top: 8px; font-size: 0.875rem; color: var(--muted); }
    summary { cursor: pointer; }
    footer { margin-top: 32px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>TinyCloud Labs Helm Charts</h1>
  <p>Helm charts for the TinyCloud Labs homelab. <a href="https://github.com/tinycloud-labs/helm">Source on GitHub</a></p>

  <h2>Add the repository</h2>
  <pre><code>helm repo add tinycloud-labs https://tinycloud-labs.github.io/helm
helm repo update</code></pre>

  <h2>Charts</h2>
{{CHARTS}}

  <footer>Index generated {{GENERATED}} from <a href="index.yaml">index.yaml</a>.</footer>
</body>
</html>
