---
app:
  name: linkwarden
  image:
    repository: ghcr.io/linkwarden/linkwarden
    pullPolicy: IfNotPresent
    tag: latest

  ports:
    - containerPort: 3000
  service:
    ports:
      - port: 80
        targetPort: 3000

  volumeMounts:
    - mountPath: /data/data
      subPath: data

  dbHostname: postgres-unichart

  envFromSecrets:
    enabled: true
    secretRefNames:
      - meilisearch
      - linkwarden

  env:
    - name: NEXTAUTH_URL
      value: "http://localhost:3000/api/v1/auth"
    - name: MEILI_HOST
      value: "meilisearch-unichart.apps.svc.cluster.local:7700"
#    - name: DATABASE_URL
#      value: "postgresql://postgres:Zm9vYmFyCg@linkwarden-test-unichart-db-headless.apps.svc.cluster.local:5432/postgres"

## ------------ StatefulSet Specifications ------------ ##
database:
  enabled: true
  host: postgres-unichart
  port: 5432

  env:
    - name: POSTGRES_HOST_AUTH_METHOD
      value: "trust"

  image:
    repository: postgres
    tag: 16-alpine
  volumeMounts:
    - mountPath: /var/lib/postgresql/data
      subPath: pgdata

ingress:
  enabled: true
  host: "linkwarden.shakir.cloud"
  ingressClassName: "traefik"
  port: 80

## ------------ Persistence ------------ ##
persistence:
  # -- App (Deployment): stays on CSI-NFS, static PV/subPath pattern --
  app:
    enabled: true
    size: 200Mi
    accessMode: ReadWriteMany
    reclaimPolicy: Retain
    storageClassName: ""   # empty = static NFS PV, no dynamic provisioner
    nfs:
      server: synology.shakir.cloud
      path: /volume1/k3s-main/linkwarden

  # -- Database (StatefulSet): moves to Proxmox CSI, one disk per replica via volumeClaimTemplates --
# Dynamic provisioning via storage class (no retain)
#  database:
#    enabled: true
#    size: 512Mi
#    accessMode: ReadWriteOnce
#    storageClassName: proxmox
  database:
    size: 512Mi
    accessMode: ReadWriteOnce
    storageClassName: proxmox      # must match the PV's class so the claim binds
    existingVolume:
      handle: ""                   # empty = dynamic provisioning (bootstrap mode)
      fsType: xfs
      region: homelab
      zone: "pve1"                     # PVE node name that holds the disk
      volumeAttributes: {}         # copied verbatim from the live PV
