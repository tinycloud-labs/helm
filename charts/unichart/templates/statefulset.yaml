{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "app.name" . }}
  labels: {{ include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "app.selectorLabels" (dict "role" "database" "context" .) | nindent 6 }}-statefulset
  serviceName: {{ include "app.dbHeadlessServiceName" . }}
  replicas: {{ .Values.database.replicaCount | default 1 }}
  template:
    metadata:
      labels: {{ include "app.selectorLabels" (dict "role" "database" "context" .) | nindent 8 }}-statefulset
    spec:
      containers:
        - name: {{ include "app.database" . }}
          {{- $image := "" }}
          {{- if .Values.database.image.digest }}
            {{- $image = printf "%s@%s" .Values.database.image.repository .Values.database.image.digest }}
          {{- else }}
            {{- $image = printf "%s:%s" .Values.database.image.repository .Values.database.image.tag }}
          {{- end }}
          image: "{{ $image }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          {{- if .Values.database.env }}
          env:
            {{- range .Values.database.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- range .Values.database.volumeMounts }}
            - name: db-storage
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath }}
            {{- end }}
          {{- if .Values.database.securityContext.enabled }}
          securityContext:
            runAsUser: {{ .Values.database.securityContext.runAsUser }}
            runAsGroup: {{ .Values.database.securityContext.runAsGroup }}
            runAsNonRoot: {{ .Values.database.securityContext.runAsNonRoot }}
          {{- end }}
      {{- if .Values.database.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.database.securityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.database.securityContext.fsGroupChangePolicy }}
      {{- end }}
      {{- with .Values.database.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  # -- Per-replica PVC, created and owned by the StatefulSet itself --
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes:
          - {{ .Values.persistence.database.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.database.size }}
        {{- if .Values.persistence.database.storageClassName }}
        storageClassName: {{ .Values.persistence.database.storageClassName }}
        {{- end }}
{{- end }}
